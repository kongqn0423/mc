services:
  - type: web
    name: mark-community
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: RENDER
        value: "true"
      - key: RENDER_URL
        value: "https://mark-community.onrender.com"